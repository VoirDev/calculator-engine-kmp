[versions]
agp = "9.2.1"
kotlin = "2.4.0" # https://kotlinlang.org/docs/releases.html
kotlin-coroutines = "1.11.0" # https://github.com/Kotlin/kotlinx.coroutines

[libraries]
kotlinx-coroutines = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlin-coroutines" }
voir-decimal = { module = "dev.voir:decimal", version = "1.0.2" }

[plugins]
androidMultiplatformLibrary = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
kotlinMultiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
